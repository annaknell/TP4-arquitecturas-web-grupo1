server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalogo-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/eventos/**

        - id: recomendaciones-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/recomendaciones/**

        - id: inventario-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventario/**

        - id: compras-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/compras/**

        - id: pagos-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/pagos/**

        - id: fila-virtual-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/fila/**

        - id: reportes-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/reportes/**

        - id: notificaciones-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/notificaciones/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: catalogo-service
        url: http://localhost:8082/v3/api-docs
      - name: recomendaciones-service
        url: http://localhost:8087/v3/api-docs
      - name: compras-service
        url: http://localhost:8084/v3/api-docs
      - name: inventario-service
        url: http://localhost:8083/v3/api-docs
      - name: pagos-service
        url: http://localhost:8085/v3/api-docs
      - name: fila-virtual-service
        url: http://localhost:8086/v3/api-docs
      - name: notificaciones-service
        url: http://localhost:8088/v3/api-docs

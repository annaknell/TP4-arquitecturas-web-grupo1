server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalogo-service
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/api/eventos/**,/api/lugares/**

            - id: auth-service
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            - id: inventario-service
              uri: ${INVENTARIO_URL:http://localhost:8083}
              predicates:
                - Path=/api/inventario/**

            - id: compras-service
              uri: ${COMPRAS_URL:http://localhost:8084}
              predicates:
                - Path=/api/compras/**

            - id: pagos-service
              uri: ${PAGOS_URL:http://localhost:8085}
              predicates:
                - Path=/api/pagos/**,/reintegros/**

            - id: entradas-service
              uri: ${ENTRADAS_URL:http://localhost:8086}
              predicates:
                - Path=/api/entradas/**

            - id: fila-virtual-service
              uri: ${FILA_VIRTUAL_URL:http://localhost:8086}
              predicates:
                - Path=/api/fila/**

            - id: recomendaciones-service
              uri: ${RECOMENDACIONES_URL:http://localhost:8087}
              predicates:
                - Path=/api/recomendaciones/**,/api/preferencias/**

            - id: notificaciones-service
              uri: ${NOTIFICACIONES_URL:http://localhost:8088}
              predicates:
                - Path=/api/notificaciones/**

            - id: reportes-service
              uri: ${REPORTES_URL:http://localhost:8089}
              predicates:
                - Path=/api/reportes/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: catalogo-service
        url: ${CATALOGO_URL:http://localhost:8082}/v3/api-docs
      - name: inventario-service
        url: ${INVENTARIO_URL:http://localhost:8083}/v3/api-docs
      - name: compras-service
        url: ${COMPRAS_URL:http://localhost:8084}/v3/api-docs
      - name: pagos-service
        url: ${PAGOS_URL:http://localhost:8085}/v3/api-docs
      - name: fila-virtual-service
        url: ${FILA_VIRTUAL_URL:http://localhost:8086}/v3/api-docs
      - name: recomendaciones-service
        url: ${RECOMENDACIONES_URL:http://localhost:8087}/v3/api-docs
      - name: notificaciones-service
        url: ${NOTIFICACIONES_URL:http://localhost:8088}/v3/api-docs
      - name: reportes-service
        url: ${REPORTES_URL:http://localhost:8089}/v3/api-docs

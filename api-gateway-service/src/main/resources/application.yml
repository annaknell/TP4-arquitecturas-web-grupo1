server:
  port: 8080

auth:
  jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/api/auth/.well-known/jwks.json}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            - id: catalogo-service
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/api/eventos/**,/api/lugares/**

            - id: inventario-service
              uri: ${INVENTARIO_URL:http://localhost:8083}
              predicates:
                - Path=/api/inventario/**

            - id: compras-service
              uri: ${COMPRAS_URL:http://localhost:8084}
              predicates:
                - Path=/api/compras/**

            - id: pagos-service
              uri: ${PAGOS_URL:http://localhost:8085}
              predicates:
                - Path=/api/pagos/**,/reintegros/**

            - id: fila-virtual-service
              uri: ${FILA_VIRTUAL_URL:http://localhost:8086}
              predicates:
                - Path=/api/fila/**,/fila/**

            - id: recomendaciones-service
              uri: ${RECOMENDACIONES_URL:http://localhost:8087}
              predicates:
                - Path=/api/recomendaciones/**,/api/preferencias/**

            - id: notificaciones-service
              uri: ${NOTIFICACIONES_URL:http://localhost:8088}
              predicates:
                - Path=/api/notificaciones/**,/notificaciones/**

            - id: reportes-service
              uri: ${REPORTES_URL:http://localhost:8089}
              predicates:
                - Path=/api/reportes/**

            - id: entradas-service
              uri: ${ENTRADAS_URL:http://localhost:8090}
              predicates:
                - Path=/api/entradas/**

            # rutas proxy de OpenAPI para que Swagger UI consuma siempre desde localhost:8080
            - id: docs-auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - SetPath=/v3/api-docs

            - id: docs-catalogo
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/catalogo
              filters:
                - SetPath=/v3/api-docs

            - id: docs-inventario
              uri: ${INVENTARIO_URL:http://localhost:8083}
              predicates:
                - Path=/v3/api-docs/inventario
              filters:
                - SetPath=/v3/api-docs

            - id: docs-compras
              uri: ${COMPRAS_URL:http://localhost:8084}
              predicates:
                - Path=/v3/api-docs/compras
              filters:
                - SetPath=/v3/api-docs

            - id: docs-pagos
              uri: ${PAGOS_URL:http://localhost:8085}
              predicates:
                - Path=/v3/api-docs/pagos
              filters:
                - SetPath=/v3/api-docs

            - id: docs-fila-virtual
              uri: ${FILA_VIRTUAL_URL:http://localhost:8086}
              predicates:
                - Path=/v3/api-docs/fila-virtual
              filters:
                - SetPath=/v3/api-docs

            - id: docs-recomendaciones
              uri: ${RECOMENDACIONES_URL:http://localhost:8087}
              predicates:
                - Path=/v3/api-docs/recomendaciones
              filters:
                - SetPath=/v3/api-docs

            - id: docs-notificaciones
              uri: ${NOTIFICACIONES_URL:http://localhost:8088}
              predicates:
                - Path=/v3/api-docs/notificaciones
              filters:
                - SetPath=/v3/api-docs

            - id: docs-reportes
              uri: ${REPORTES_URL:http://localhost:8089}
              predicates:
                - Path=/v3/api-docs/reportes
              filters:
                - SetPath=/v3/api-docs

            - id: docs-entradas
              uri: ${ENTRADAS_URL:http://localhost:8090}
              predicates:
                - Path=/v3/api-docs/entradas
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: http://localhost:8080/v3/api-docs/auth
      - name: catalogo-service
        url: http://localhost:8080/v3/api-docs/catalogo
      - name: inventario-service
        url: http://localhost:8080/v3/api-docs/inventario
      - name: compras-service
        url: http://localhost:8080/v3/api-docs/compras
      - name: pagos-service
        url: http://localhost:8080/v3/api-docs/pagos
      - name: fila-virtual-service
        url: http://localhost:8080/v3/api-docs/fila-virtual
      - name: recomendaciones-service
        url: http://localhost:8080/v3/api-docs/recomendaciones
      - name: notificaciones-service
        url: http://localhost:8080/v3/api-docs/notificaciones
      - name: reportes-service
        url: http://localhost:8080/v3/api-docs/reportes
      - name: entradas-service
        url: http://localhost:8080/v3/api-docs/entradas
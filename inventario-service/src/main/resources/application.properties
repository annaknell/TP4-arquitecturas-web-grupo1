server.port=${SERVER_PORT:8083}
server.error.include-message=always

spring.application.name=inventario-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketya_inventory}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

inventario.reserva.minutos=${RESERVA_MINUTOS:10}
inventario.reserva.barrido-ms=${BARRIDO_MS:5000}

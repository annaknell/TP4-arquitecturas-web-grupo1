spring.application.name=recomendaciones-service
server.port=8087

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=ticket_ya_recomendaciones

logging.level.org.springframework.data.mongodb=DEBUG

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n
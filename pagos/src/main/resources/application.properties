spring.application.name=pagos

logging.pattern.level=%5p [traceId=%X{traceId:-}]
reintegros.reintento.habilitado=true
reintegros.reintento.intervalo-ms=30000
reintegros.reintento.antiguedad-min-seg=30
pagos.idempotencia.duracion-horas=24

// Si tenés un perfil de test, poné reintegros.reintento.habilitado=false ahí para que el scheduler no interfiera con las pruebas.
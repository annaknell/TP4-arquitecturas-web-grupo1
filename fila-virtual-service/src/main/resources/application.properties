spring.application.name=fila-virtual-service
server.port=8086

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
fila.virtual.vencimientos.fixed-delay-ms=30000

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n

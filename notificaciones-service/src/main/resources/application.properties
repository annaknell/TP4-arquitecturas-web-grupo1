spring.application.name=notificaciones-service
server.port=${SERVER_PORT:8088}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticket_ya_notificaciones?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
compra-service.url=${COMPRA_SERVICE_URL:http://localhost:8084}
recomendaciones-service.url=${RECOMENDACIONES_SERVICE_URL:http://localhost:8087}

notificaciones.procesamiento.intervalo-ms=${NOTIFICACIONES_PROCESAMIENTO_INTERVALO_MS:10000}
notificaciones.reintentos.maximos=${NOTIFICACIONES_REINTENTOS_MAXIMOS:3}
notificaciones.reintentos.demora-inicial-segundos=${NOTIFICACIONES_REINTENTOS_DEMORA_INICIAL_SEGUNDOS:30}

# Timeouts de RestClient: se aplican al RestClient.Builder inyectado por Spring.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

# Circuit breaker de los clientes de compras y preferencias (los reintentos de
# emails siguen siendo los de US-38, no se duplican acá).
resilience4j.circuitbreaker.instances.compradores.sliding-window-size=20
resilience4j.circuitbreaker.instances.compradores.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.compradores.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.preferencias.sliding-window-size=20
resilience4j.circuitbreaker.instances.preferencias.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.preferencias.wait-duration-in-open-state=10s

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n

spring.application.name=auth-service
server.port=8081

# BD en memoria para las pruebas de integración
spring.datasource.url=jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Claves efímeras generadas por JwtKeyConfig (no se configuran a propósito)
auth.jwt.key-id=test-rs256
auth.jwt.expiration-minutes=60

auth.admin.email=admin@ticketya.com
auth.admin.password=Admin123!
auth.admin.nombre=Administrador General

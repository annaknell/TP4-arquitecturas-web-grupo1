spring.application.name=auth-service
server.port=8081

# ---------------------------------------------------------------------------
# Base de datos propia del servicio (aislada del resto)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_ya_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT (RS256)
#   Si no se configuran las claves, se genera un par ef\u00edmero por sesi\u00f3n
#   (solo \u00fatil en desarrollo: los tokens previos dejan de ser v\u00e1lidos).
#   En producci\u00f3n/docker, proveer:
#     AUTH_JWT_PRIVATE_KEY (Base64 PKCS#8) y AUTH_JWT_PUBLIC_KEY (Base64 X.509)
# ---------------------------------------------------------------------------
auth.jwt.key-id=auth-service-rs256
auth.jwt.expiration-minutes=60

# ---------------------------------------------------------------------------
# Usuario ADMINISTRADOR inicial (semilla). La contrase\u00f1a NUNCA se loguea.
#   Override en docker/producci\u00f3n: AUTH_ADMIN_PASSWORD
# ---------------------------------------------------------------------------
auth.admin.email=admin@ticketya.com
auth.admin.password=${AUTH_ADMIN_PASSWORD:Admin123!}
auth.admin.nombre=Administrador General

# ---------------------------------------------------------------------------
# Logs con correlaci\u00f3n (X-Correlation-Id en MDC). Sin datos sensibles.
# ---------------------------------------------------------------------------
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n

springdoc.swagger-ui.path=/swagger-ui.html

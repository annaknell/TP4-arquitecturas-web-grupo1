spring.application.name=reportes-service
server.port=8089
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_ya_reportes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
auth.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/api/auth/.well-known/jwks.json}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

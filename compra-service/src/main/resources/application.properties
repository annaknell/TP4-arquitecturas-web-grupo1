spring.application.name=compra-service
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_ya_compras?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Timeouts de los clientes Feign: sin esto un servicio caído bloquea el hilo
# hasta el timeout por defecto y la compra queda colgada.
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=3000

# Resiliencia del cobro (PagosClientResiliente). Reintentos seguros por Idempotency-Key.
resilience4j.retry.instances.cobroPagos.retry-exceptions=feign.FeignException,java.io.IOException
resilience4j.retry.instances.cobroPagos.max-attempts=3
resilience4j.retry.instances.cobroPagos.wait-duration=200ms
resilience4j.retry.instances.cobroPagos.enable-exponential-backoff=true
resilience4j.retry.instances.cobroPagos.exponential-backoff-multiplier=2
resilience4j.circuitbreaker.instances.cobroPagos.sliding-window-size=20
resilience4j.circuitbreaker.instances.cobroPagos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cobroPagos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cobroPagos.permitted-number-of-calls-in-half-open-state=3

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n

spring.application.name=pagos
server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_ya_pagos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
reintegros.reintento.habilitado=true
reintegros.reintento.intervalo-ms=30000
reintegros.reintento.antiguedad-min-seg=30
logging.level.org.springframework.web=DEBUG
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n

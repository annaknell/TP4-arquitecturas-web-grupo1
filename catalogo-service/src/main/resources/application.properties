spring.application.name=catalogo-service
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_ya_catalogo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
entrada-service.url=http://localhost:8090
fila-virtual-service.url=http://localhost:8086
inventario-service.url=http://localhost:8083
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Timeouts de RestClient: se aplican al RestClient.Builder inyectado por Spring.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

# Circuit breaker de los clientes HTTP criticos de catalogo.
resilience4j.circuitbreaker.instances.catalogoEntradas.sliding-window-size=20
resilience4j.circuitbreaker.instances.catalogoEntradas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogoEntradas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogoPagos.sliding-window-size=20
resilience4j.circuitbreaker.instances.catalogoPagos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogoPagos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogoFilaVirtual.sliding-window-size=20
resilience4j.circuitbreaker.instances.catalogoFilaVirtual.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogoFilaVirtual.wait-duration-in-open-state=10s

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n


spring.application.name=entrada-service
server.port=8090
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_ya_entradas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
catalogo-service.url=http://localhost:8082
compra-service.url=http://localhost:8084
pago-service.url=http://localhost:8085
inventario-service.url=http://localhost:8083

# Timeouts de RestClient: se aplican al RestClient.Builder inyectado por Spring.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

# Logs con correlacion (X-Correlation-Id en MDC). Sin datos sensibles.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] [%15.15t] %-40.40logger{36} : %m%n
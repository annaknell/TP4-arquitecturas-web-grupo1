name: ticketya

x-mysql: &mysqlCredenciales
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ticketya}

x-rabbit: &rabbitCredenciales
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USER:-ticketya}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketya}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ticketya}
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - datos-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketya}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketya}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway-service:
    build: ./api-gateway-service
    environment:
      CATALOGO_URL: http://catalogo-service:8082
      INVENTARIO_URL: http://inventario-service:8083
      COMPRAS_URL: http://compra-service:8084
      PAGOS_URL: http://pago-service:8085
      ENTRADAS_URL: http://entrada-service:8086
      AUTH_URL: http://auth-service:8081
      AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      FILA_VIRTUAL_URL: http://fila-virtual-service:8086
      RECOMENDACIONES_URL: http://recomendaciones-service:8087
      NOTIFICACIONES_URL: http://notificaciones-service:8088
      REPORTES_URL: http://reportes-service:8089
    ports:
      - "8080:8080"
    mem_limit: 420m
    restart: on-failure
    depends_on:
      catalogo-service:
        condition: service_started
      inventario-service:
        condition: service_started
      compra-service:
        condition: service_started
      pago-service:
        condition: service_started
      fila-virtual-service:
        condition: service_started
      auth-service:
        condition: service_started
      entrada-service:
        condition: service_started

  auth-service:
    build: ./auth-service
    environment:
      <<: *mysqlCredenciales
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_auth?createDatabaseIfNotExist=true
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-Admin123!}
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  catalogo-service:
    build: ./catalogo-service
    environment:
      <<: [*mysqlCredenciales, *rabbitCredenciales]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_catalogo?createDatabaseIfNotExist=true
      ENTRADA_SERVICE_URL: http://entrada-service:8086
      FILA_VIRTUAL_SERVICE_URL: http://fila-virtual-service:8086
      PAGO_SERVICE_URL: http://pago-service:8085
      INVENTARIO_SERVICE_URL: http://inventario-service:8083
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventario-service:
    build: ./inventario-service
    environment:
      <<: *mysqlCredenciales
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_inventario?createDatabaseIfNotExist=true
      FILA_VIRTUAL_SERVICE_URL: http://fila-virtual-service:8086
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  compra-service:
    build: ./compra-service
    environment:
      <<: [*mysqlCredenciales, *rabbitCredenciales]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_compras?createDatabaseIfNotExist=true
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      ENTRADA_SERVICE_URL: http://entrada-service:8086
      INVENTARIO_SERVICE_URL: http://inventario-service:8083
      PAGO_SERVICE_URL: http://pago-service:8085
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pago-service:
    build: ./pago-service
    environment:
      <<: [*mysqlCredenciales, *rabbitCredenciales]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_pagos?createDatabaseIfNotExist=true
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  entrada-service:
    build: ./entrada-service
    environment:
      <<: *mysqlCredenciales
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_entradas?createDatabaseIfNotExist=true
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      COMPRA_SERVICE_URL: http://compra-service:8084
      PAGO_SERVICE_URL: http://pago-service:8085
      INVENTARIO_SERVICE_URL: http://inventario-service:8083
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  fila-virtual-service:
    build: ./fila-virtual-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 420m
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy

  recomendaciones-service:
    build: ./recomendaciones-service
    environment:
      SPRING_MONGODB_HOST: mongo
      SPRING_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: 27017
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy

  notificaciones-service:
    build: ./notificaciones-service
    environment:
      <<: [*mysqlCredenciales, *rabbitCredenciales]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_notificaciones?createDatabaseIfNotExist=true
      COMPRA_SERVICE_URL: http://compra-service:8084
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reportes-service:
    build: ./reportes-service
    environment:
      <<: [*mysqlCredenciales, *rabbitCredenciales]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_ya_reportes?createDatabaseIfNotExist=true
      AUTH_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 420m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Trazabilidad (US-38): logs centralizados con Loki + Promtail + Grafana.
  # En Grafana (http://localhost:3000) buscar por {correlation_id="abc-123"}
  # o simplemente por el texto del cid en el explorador de Loki.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - datos-loki:/loki
    mem_limit: 512m
    restart: on-failure

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    mem_limit: 256m
    restart: on-failure
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - datos-grafana:/var/lib/grafana
    mem_limit: 512m
    restart: on-failure
    depends_on:
      - loki

volumes:
  datos-mysql:
  datos-mongo:
  datos-loki:
  datos-grafana:
